name: SmartHire checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SMARTHIRE_DB: sqlite
      DJANGO_SECRET_KEY: ci-test-key-not-for-deployment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django configuration checks
        run: python manage.py check
      - name: Run application tests
        run: python manage.py test smarthire --verbosity 2
